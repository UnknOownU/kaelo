[package]
name = "kaelo-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP server for Kaelo — Model Context Protocol tools for AI agent integration"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rmcp = { version = "=1.7.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
kaelo-core = { path = "../kaelo-core" }
kaelo-fetch = { path = "../kaelo-fetch", features = ["headless"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
