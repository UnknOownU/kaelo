[package]
name = "kaelo"
version = "1.0.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
repository = "https://github.com/HachemiH/kaelo"
keywords = ["mcp", "web-fetching", "ai-agent", "web-scraping"]
categories = ["web-programming", "command-line-utilities"]
description = "Intelligent web fetching for AI agents — MCP server with route caching and SPA support"

[[bin]]
name = "kaelo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "charset", "http2", "system-proxy"] }
semver = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
flate2 = "1"
sha2 = "0.10"
dom_smoothie = "0.17"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "=1.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
wreq = { version = "=6.0.0-rc.28", optional = true }
wreq-util = { version = "3.0.0-rc.10", optional = true }
chromiumoxide = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
url = "2"
hyper = { version = "1", features = ["server"] }
hyper-util = "0.1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
tokio-util = "0.7"

[dev-dependencies]
criterion = "0.5"
filetime = "0.2"

[features]
default = ["headless"]
tls-impersonation = ["wreq", "wreq-util"]
headless = ["chromiumoxide", "futures"]

[[bench]]
name = "benchmark"
harness = false
