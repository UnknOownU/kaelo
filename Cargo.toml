[workspace]
members = [
    "kaelo-core",
    "kaelo-fetch",
    "kaelo-mcp",
    "kaelo-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
repository = "https://github.com/HachemiH/kaelo"
keywords = ["mcp", "web-fetching", "ai-agent", "web-scraping"]
categories = ["web-programming", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
toml = "0.8"
