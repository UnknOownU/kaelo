[package]
name = "kaelo-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-strategy fetch backends for Kaelo — HTTP, TLS impersonation, headless browser"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
kaelo-core = { path = "../kaelo-core" }
reqwest = { workspace = true }
wreq = { version = "=6.0.0-rc.28", optional = true }
wreq-util = { version = "3.0.0-rc.10", optional = true }
chromiumoxide = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
tls-impersonation = ["wreq", "wreq-util"]
headless = ["chromiumoxide", "futures"]
