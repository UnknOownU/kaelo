[package]
name = "kaelo-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kaelo"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
kaelo-core = { path = "../kaelo-core" }
kaelo-fetch = { path = "../kaelo-fetch", features = ["headless"] }
kaelo-mcp = { path = "../kaelo-mcp" }
