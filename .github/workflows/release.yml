name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p kaelo-cli --target ${{ matrix.target }}
          else
            cargo build --release -p kaelo-cli --target ${{ matrix.target }}
          fi

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/kaelo || true

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME}
          ARCHIVE=kaelo-${VERSION}-${{ matrix.target }}.tar.gz
          tar czf ${ARCHIVE} -C target/${{ matrix.target }}/release kaelo
          shasum -a 256 ${ARCHIVE} > ${ARCHIVE}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaelo-${{ matrix.target }}
          path: |
            kaelo-*.tar.gz
            kaelo-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          body: |
            ## Install

            **macOS / Linux (one-liner):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/HachemiH/kaelo/main/install.sh | sh
            ```

            **Homebrew (macOS):**
            ```bash
            brew tap HachemiH/kaelo
            brew install kaelo
            ```

            **From source:**
            ```bash
            cargo install --git https://github.com/HachemiH/kaelo
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
